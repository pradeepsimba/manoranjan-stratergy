# WebSocket upgrade support for /ws/dashboard - $connection_upgrade is
# "upgrade" when the client sent an Upgrade header, "close" otherwise (a
# hardcoded "upgrade" would break every plain HTTP request instead).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker's embedded DNS server (2026-09-24, found in review, live-verified
# against a real deployment) - by default, a plain `proxy_pass http://app:
# 8080;` (a static hostname, no variable) makes nginx resolve "app" to an
# IP ONCE, at config load, and cache it for the life of the worker process.
# Every `docker compose up -d --build app` (or any recreate of just the app
# service without also restarting/reloading nginx) gives the app container
# a NEW internal IP — nginx keeps trying the OLD one until it's reloaded,
# producing exactly the same "connect() failed (111: Connection refused)"
# 502-class symptom as the ORIGINAL incident this repo's history is built
# around (see CLAUDE.md's "Run" section), just from a different root cause
# (stale DNS cache, not a wrong DSN). Confirmed happening for real: a live
# deployment's nginx error log showed this exact failure right after an app
# rebuild changed its IP. The fix is the standard Docker+nginx pattern: a
# `resolver` pointed at Docker's embedded DNS (127.0.0.11) with a short
# `valid=` TTL, combined with a variable in proxy_pass below (a static
# hostname short-circuits the resolver and reverts to the old cache-forever
# behavior; a variable forces nginx to actually re-resolve per the TTL).
resolver 127.0.0.11 valid=10s;

server {
    listen 8082 ssl;
    server_name algo.vaangamart.com;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256";
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 50M;

    # A plain http:// request landing on this SSL-only listener fails the TLS
    # handshake before nginx can even read a Location - nginx's fix for
    # exactly that case is its synthetic 497 "plain HTTP sent to HTTPS port"
    # error code, which error_page can still redirect from.
    error_page 497 https://$host:$server_port$request_uri;

    location / {
        # $upstream (not a literal "app:8080") is what actually makes the
        # `resolver` directive above take effect - see its comment.
        set $upstream app:8080;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900s;
    }
}
