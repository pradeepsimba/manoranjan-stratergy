# WebSocket upgrade support for /ws/dashboard - $connection_upgrade is
# "upgrade" when the client sent an Upgrade header, "close" otherwise (a
# hardcoded "upgrade" would break every plain HTTP request instead).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8082 ssl;
    server_name algo.vaangamart.com;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256";
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 50M;

    # A plain http:// request landing on this SSL-only listener fails the TLS
    # handshake before nginx can even read a Location - nginx's fix for
    # exactly that case is its synthetic 497 "plain HTTP sent to HTTPS port"
    # error code, which error_page can still redirect from.
    error_page 497 https://$host:$server_port$request_uri;

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900s;
    }
}
