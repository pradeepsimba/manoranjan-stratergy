services:
  app:
    build: .
    # Overridable per checkout (see .env.example) — container_name is unique
    # HOST-WIDE, unlike Compose's default <project>-<service>-1 naming, so
    # running a second branch/checkout of this same repo alongside this one
    # needs its own .env with a different APP_CONTAINER_NAME/APP_PORT (and
    # CADDY_CONTAINER_NAME/CADDY_PORT below) or the two deployments collide.
    container_name: ${APP_CONTAINER_NAME:-mano-app}
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      # Connects to PostgreSQL running on the host machine.
      # host.docker.internal resolves to the host via the mapping below (Linux).
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://postgres:postgres@host.docker.internal:5432/trading_db}
      # Whole-app login (see app/auth.py) - main.py's load_dotenv() can't see
      # this project's .env from inside the container (never copied/mounted
      # into the image), so these must be passed through explicitly like
      # POSTGRES_DSN above, or login always fails ("invalid" for every
      # password - an empty SETTINGS_PASSWORD can never match).
      SETTINGS_USER: ${SETTINGS_USER:-admin}
      SETTINGS_PASSWORD: ${SETTINGS_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      # Internal only now - the "nginx" service below is the public entry
      # point (https://algo.vaangamart.com:8082), terminating TLS and
      # reverse-proxying here in plain HTTP. Not reachable directly from the
      # host any more (a second checkout's APP_PORT override moved to nginx's
      # own port below).
      - "8080"

  # TLS-terminating reverse proxy in front of the SAME app container above —
  # not a second copy of it (the scheduler/WebSocket feed/AppState are an
  # in-process singleton; a second `uvicorn main:app` would duplicate the
  # live trading engine). Exists only so the dashboard can be reached over
  # HTTPS on the LAN (http://192.168.x.x:8001 keeps working unchanged) —
  # browsers restrict the Notification API (see static/js/alerts.js) to
  # secure contexts, which a plain-HTTP LAN IP never satisfies.
  caddy:
    image: caddy:2-alpine
    container_name: ${CADDY_CONTAINER_NAME:-mano-caddy}
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # Docker's internal DNS name for the app container — see the Caddyfile's
      # {$UPSTREAM} note (running Caddy natively on the host needs no such var).
      UPSTREAM: app:8080
    ports:
      - "${CADDY_PORT:-8443}:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Public entry point for the real algo.vaangamart.com cert (see ssl.sh /
  # ssl-deploy-hook.sh) - terminates TLS, redirects plain http:// requests to
  # https (nginx's error_page 497 trick, same as backend_server_algo's
  # default.conf), and reverse-proxies to the app container above in plain
  # HTTP. Separate from "caddy" above, which is LAN-only (self-signed,
  # different port/purpose) and untouched by this.
  nginx:
    image: nginx:1.27-alpine
    container_name: ${NGINX_CONTAINER_NAME:-mano-nginx}
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_PORT:-8082}:8082"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/ssl:ro

volumes:
  caddy_data:
  caddy_config:
