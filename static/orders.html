<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alto — Orders</title>
  <meta name="description" content="Order book — pending, executed, cancelled, rejected">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%232fd39b'/><path d='M6.5 17.5v-5.5M10.5 17.5v-11M14.5 17.5v-4M18.5 17.5V8' stroke='%23052e21' stroke-width='2.2' stroke-linecap='round'/></svg>">
  <script>
    (function(){
      var t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header class="app-bar">
    <div class="brand">
      <div class="brand-mark">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 19V10M9 19V5M14 19V13M19 19V8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <span class="brand-name">Alto</span>
        <span class="brand-sub">Paper Trading</span>
      </div>
    </div>
    <nav class="nav-seg">
      <a href="/">Terminal</a>
      <a href="/holdings">Holdings</a>
      <a href="/positions">Positions</a>
      <a href="/orders" class="active">Orders</a>
      <a href="/console">Console</a>
      <a href="/settings">Settings</a>
    </nav>
    <div class="app-bar-right">
      <span class="badge gray" id="phase-badge">—</span>
      <span class="badge gray" id="ws-status">—</span>
      <span class="bar-divider"></span>
      <div class="clock-wrap funds-chip"><div class="clock" id="stat-funds" style="font-size:16px">₹0.00</div><div class="clock-sub">Funds</div></div>
      <div class="clock-wrap"><div class="clock" id="clock">--:--:--</div><div class="clock-sub">IST</div></div>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="btn-mini" onclick="logout()">Log out</button>
    </div>
  </header>

  <div class="page-head"><div><h1 class="page-title">Orders</h1><p class="page-sub">Complete order book — placements, fills, rejections and cancellations</p></div></div>

  <div class="page-grid">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Order Book</span>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="nav-seg" style="padding:2px">
            <a href="#" class="active" id="filter-all" onclick="setOrderFilter('ALL');return false;">All</a>
            <a href="#" id="filter-pending" onclick="setOrderFilter('PENDING');return false;">Pending</a>
            <a href="#" id="filter-complete" onclick="setOrderFilter('COMPLETE');return false;">Executed</a>
          </div>
          <div class="nav-seg" style="padding:2px">
            <a href="#" id="filter-today" onclick="toggleTodayFilter();return false;">Today Only</a>
          </div>
        </div>
      </div>
      <div class="tbl-wrap">
        <table class="cardify">
          <thead>
            <tr><th>Time</th><th>Symbol</th><th>Side</th><th class="num-col">Qty</th>
                <th>Type</th><th>Product</th><th class="num-col">Price</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="orders-tbody"><tr><td colspan="9" class="empty-cell">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/js/util.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/orders.js"></script>
</body>
</html>
