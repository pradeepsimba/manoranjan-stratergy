<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alto — Settings</title>
  <meta name="description" content="Platform tunables — session timings, starting funds, engine cadence">
  <link rel="stylesheet" href="/css/dashboard.css">
  <script>
    (function(){
      var t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    .settings-toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      flex-wrap: wrap; padding: 12px 18px 0;
    }
    .settings-wrap {
      max-width: 1180px;
      margin: 0 auto 90px;
      padding: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
      align-items: start;
    }
    .settings-note {
      grid-column: 1 / -1;
      font-size: 12px;
      color: var(--txt-2);
      background: var(--surf);
      border: 1px solid var(--edge-soft);
      border-radius: var(--r);
      padding: 10px 14px;
      line-height: 1.5;
    }
    .set-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 14px;
      border-top: 1px solid var(--edge-soft);
    }
    .set-row:first-of-type { border-top: none; }
    .set-info  { min-width: 0; }
    .set-label { font-size: 12.5px; color: var(--txt); display: flex; align-items: center; gap: 6px; }
    .set-help  { font-size: 10.5px; color: var(--txt-3); margin-top: 2px; line-height: 1.35; }
    .set-default { font-size: 10px; color: var(--txt-3); margin-top: 2px; }
    .set-ctl { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .set-ctl .field-input { width: 110px; text-align: right; }
    .set-ctl .field-input[type="time"] { width: 110px; text-align: left; }
    .set-ctl .field-input.wide { width: 170px; text-align: left; }
    .set-row.dirty .set-label::after { content: '●'; color: var(--warn); font-size: 8px; }
    .set-nested {
      padding-left: 26px;
      background: color-mix(in srgb, var(--surf) 55%, var(--bg));
      border-left: 2px solid var(--prime-container);
    }
    .set-nested .set-label { font-size: 12px; color: var(--txt-2); }
    .dot-override { width: 6px; height: 6px; border-radius: 50%; background: var(--prime); flex-shrink: 0; display: inline-block; }

    .switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; cursor: pointer;
      background: var(--surf-high); border: 1px solid var(--edge);
      border-radius: 20px; transition: background .15s ease;
    }
    .slider::before {
      content: ''; position: absolute; height: 14px; width: 14px;
      left: 2px; top: 2px; background: var(--txt-2);
      border-radius: 50%; transition: transform .15s ease, background .15s ease;
    }
    .switch input:checked + .slider { background: var(--prime-container); border-color: var(--prime-dim); }
    .switch input:checked + .slider::before { transform: translateX(16px); background: var(--prime); }

    .save-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: none; align-items: center; justify-content: center; gap: 14px;
      padding: 12px 18px; background: var(--surf-raised); border-top: 1px solid var(--edge);
      box-shadow: 0 -6px 24px rgba(0,0,0,.35);
    }
    .save-bar.visible { display: flex; }
    .save-bar .count { font-size: 12px; color: var(--txt-2); }
    .btn-save {
      background: var(--prime); color: var(--on-prime); border: none;
      border-radius: var(--r-sm); font-size: 12px; font-weight: 700; padding: 8px 22px; cursor: pointer;
    }
    .btn-save:hover { background: var(--prime-dim); }
    .btn-save:disabled { opacity: .5; cursor: default; }
    .btn-discard { background: none; border: 1px solid var(--edge); color: var(--txt-2); border-radius: var(--r-sm); font-size: 12px; padding: 8px 14px; cursor: pointer; }

    .grp-badge { font-size: 10px; }
    .set-search { width: 200px; }
    .panel.filtered-out { display: none; }
    .set-row.filtered-out { display: none; }
    .no-results { grid-column: 1 / -1; text-align: center; color: var(--txt-3); padding: 30px; font-size: 13px; }

    @media (max-width: 640px) {
      .settings-toolbar { padding: 8px 12px 0; }
      .set-search { flex: 1; width: auto; }
      .settings-wrap { grid-template-columns: 1fr; padding: 12px; }
    }
  </style>
</head>
<body>

<header class="app-bar">
  <div class="brand">
    <div class="brand-mark">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 19V10M9 19V5M14 19V13M19 19V8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <span class="brand-name">Alto</span>
      <span class="brand-sub">Paper Trading</span>
    </div>
  </div>
  <nav class="nav-seg">
    <a href="/">Terminal</a>
    <a href="/holdings">Holdings</a>
    <a href="/positions">Positions</a>
    <a href="/orders">Orders</a>
    <a href="/console">Console</a>
    <a href="/settings" class="active">Settings</a>
  </nav>
  <div class="app-bar-right">
    <span class="badge gray" id="phase-badge">—</span>
    <span class="badge gray" id="ws-status">—</span>
    <span class="bar-divider"></span>
    <div class="clock-wrap funds-chip"><div class="clock" id="stat-funds" style="font-size:16px">₹0.00</div><div class="clock-sub">Funds</div></div>
    <div class="clock-wrap"><div class="clock" id="clock">--:--:--</div><div class="clock-sub">IST</div></div>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="btn-mini" onclick="logout()">Log out</button>
  </div>
</header>

<div class="settings-toolbar">
  <input class="field-input set-search" id="set-search" type="text"
         placeholder="Filter settings…" oninput="filterSettings(this.value)">
  <button class="btn-mini danger" onclick="resetAll()" title="Reset every setting to its default">Reset all</button>
</div>

<div class="settings-wrap" id="settings-wrap">
  <div class="settings-note">
    Changes apply <b>immediately after saving</b> — no restart needed — and persist across restarts.
    A <span class="dot-override" style="vertical-align:middle"></span> dot marks a value that differs
    from its built-in default.
  </div>
  <div class="settings-note" id="loading-note">Loading settings…</div>
</div>

<div class="save-bar" id="save-bar">
  <span class="count" id="save-count">0 unsaved changes</span>
  <button class="btn-save" id="btn-save" onclick="saveChanges()">Save changes</button>
  <button class="btn-discard" onclick="discardChanges()">Discard</button>
</div>

<script src="/js/util.js"></script>
<script src="/js/app.js"></script>
<script src="/js/settings.js"></script>
</body>
</html>
