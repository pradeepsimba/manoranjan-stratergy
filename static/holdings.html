<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alto — Holdings</title>
  <meta name="description" content="Delivery holdings and unrealized P&amp;L">
  <link rel="stylesheet" href="/css/dashboard.css">
  <script>
    (function(){
      var t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header class="app-bar">
    <div class="brand">
      <div class="brand-mark">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 19V10M9 19V5M14 19V13M19 19V8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <span class="brand-name">Alto</span>
        <span class="brand-sub">Paper Trading</span>
      </div>
    </div>
    <nav class="nav-seg">
      <a href="/">Terminal</a>
      <a href="/holdings" class="active">Holdings</a>
      <a href="/positions">Positions</a>
      <a href="/orders">Orders</a>
      <a href="/console">Console</a>
      <a href="/settings">Settings</a>
    </nav>
    <div class="app-bar-right">
      <span class="badge gray" id="phase-badge">—</span>
      <span class="badge gray" id="ws-status">—</span>
      <span class="bar-divider"></span>
      <div class="clock-wrap funds-chip"><div class="clock" id="stat-funds" style="font-size:16px">₹0.00</div><div class="clock-sub">Funds</div></div>
      <div class="clock-wrap"><div class="clock" id="clock">--:--:--</div><div class="clock-sub">IST</div></div>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="btn-mini" onclick="logout()">Log out</button>
    </div>
  </header>

  <div class="summary-strip">
    <div class="stat-card"><span class="stat-label">Invested Value</span><span class="stat-value" id="sum-invested">₹0.00</span></div>
    <div class="stat-card"><span class="stat-label">Current Value</span><span class="stat-value" id="sum-current">₹0.00</span></div>
    <div class="stat-card" id="sum-pnl-card"><span class="stat-label">Total P&amp;L</span><span class="stat-value" id="sum-pnl">₹0.00</span></div>
  </div>

  <div class="page-grid">
    <div class="panel">
      <div class="panel-header"><span class="panel-title">Holdings</span></div>
      <div class="tbl-wrap">
        <table class="cardify">
          <thead>
            <tr><th>Symbol</th><th class="num-col">Qty</th><th class="num-col">Avg. Cost</th>
                <th class="num-col">LTP</th><th class="num-col">Current Value</th><th class="num-col">P&amp;L</th></tr>
          </thead>
          <tbody id="holdings-tbody"><tr><td colspan="6" class="empty-cell">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/js/util.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/holdings.js"></script>
</body>
</html>
