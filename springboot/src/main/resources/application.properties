server.port=8080

# SQLite datasource
spring.datasource.url=jdbc:sqlite:trading.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Disable JDBC auto-commit for SQLite compatibility
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.maximum-pool-size=5

# Disable Spring Boot's schema/data auto-run (we create tables manually in DatabaseService)
spring.sql.init.mode=never

# Logging
logging.level.com.trading=INFO
logging.level.org.springframework.web.socket=WARN
