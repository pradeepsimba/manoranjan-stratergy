server.port=8080

# SQLite datasource
spring.datasource.url=jdbc:sqlite:trading.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=60000

spring.sql.init.mode=never

# Multi-threaded scheduler so @Scheduled tasks never block each other
spring.task.scheduling.pool.size=4
spring.task.scheduling.thread-name-prefix=sched-

# Spring async thread pool
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=500
spring.task.execution.thread-name-prefix=async-

# Logging
logging.level.com.trading=INFO
logging.level.org.springframework.web.socket=WARN
logging.level.com.zaxxer.hikari=WARN
